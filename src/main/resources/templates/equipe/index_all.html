<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <div class="header-row">
        <h1>Equipes</h1>
        <a href="/equipes/new" class="btn btn-primary">+ Ajouter Equipe</a>
    </div>

    <div th:if="${errorMessage}" class="badge badge-red"
         style="padding:1rem;margin-bottom:1rem;display:block;font-size:1rem">
        ⚠️ <span th:text="${errorMessage}"></span>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Ville</th>
                <th>Coach</th>
                <th>Groupe</th>
                <th>Tournoi</th>
                <th style="min-width:280px">Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e, i : ${equipes}">
                <td th:text="${i.count}"></td>
                <td th:text="${e.nom}"></td>
                <td th:text="${e.ville}"></td>
                <td th:text="${e.coach}"></td>
                <td th:text="'Groupe ' + ${e.groupe.nom}"></td>
                <td th:text="${e.groupe.tournoi.nom}"></td>
                <td>
                    <div class="actions" style="display:flex;flex-wrap:nowrap;gap:0.5rem;align-items:center;">
                        <a th:href="@{/equipes/{id}/joueurs(id=${e.id})}" class="btn btn-primary">Joueurs</a>
                        <a th:href="@{/equipes/{id}/edit(id=${e.id})}" class="btn btn-warning">Modifier</a>
                        <a th:href="@{/equipes/{id}/delete(id=${e.id})}"
                           class="btn btn-danger"
                           onclick="return confirm('Voulez-vous supprimer cette équipe ?')">Supprimer</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
