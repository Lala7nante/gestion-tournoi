<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <div class="header-row">
        <h1>Equipes</h1>
        <div th:if="${errorMessage}"
            style="background:#8b1a2e;border:1px solid #c0253f;color:#ff6b8a;
              padding:0.8rem 1.2rem;border-radius:6px;margin-bottom:1rem;
              font-weight:700;letter-spacing:1px;">
        ⚠️ <span th:text="${errorMessage}"></span>
        </div>
        <a href="/equipes/new" class="btn btn-primary">+ Ajouter Equipe</a>
    </div>

    <div th:if="${errorMessage}" class="badge badge-red"
         style="padding:1rem;margin-bottom:1rem;display:block;font-size:1rem">
        ⚠️ <span th:text="${errorMessage}"></span>
    </div>

    <!-- Barre de recherche -->
    <div style="margin-bottom:1.5rem">
        <input type="text" id="searchEquipe"
               placeholder="🔍 Rechercher une équipe, ville, coach, groupe..."
               onkeyup="filterEquipes()"
               style="width:100%;padding:0.8rem 1rem;background:#111;border:1px solid #333;
                      color:#fff;border-radius:8px;font-size:1rem;box-sizing:border-box"/>
    </div>

    <table id="equipeTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Ville</th>
                <th>Coach</th>
                <th>Groupe</th>
                <th>Tournoi</th>
                <th style="min-width:280px">Actions</th>
            </tr>
        </thead>
        <tbody id="equipeBody">
            <tr th:each="e, i : ${equipes}">
                <td th:text="${i.count}"></td>
                <td th:text="${e.nom}"></td>
                <td th:text="${e.ville}"></td>
                <td th:text="${e.coach}"></td>
                <td th:text="'Groupe ' + ${e.groupe.nom}"></td>
                <td th:text="${e.groupe.tournoi.nom}"></td>
                <td>
                    <div class="actions" style="display:flex;flex-wrap:nowrap;gap:0.5rem;align-items:center;">
                        <a th:href="@{/equipes/{id}/joueurs(id=${e.id})}" class="btn btn-primary">Joueurs</a>
                        <a th:href="@{/equipes/{id}/edit(id=${e.id})}" class="btn btn-warning">Modifier</a>
                        <a th:href="@{/equipes/{id}/delete(id=${e.id})}"
                           class="btn btn-danger"
                           onclick="return confirm('Voulez-vous supprimer cette équipe ?')">Supprimer</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Message si aucun résultat -->
    <div id="noResult" style="display:none;text-align:center;color:#666;padding:2rem">
        Aucune équipe trouvée
    </div>
</div>

<script>
function filterEquipes() {
    const input = document.getElementById('searchEquipe').value.toLowerCase();
    const rows = document.querySelectorAll('#equipeBody tr');
    let count = 0;

    rows.forEach(row => {
        const text = row.textContent.toLowerCase();
        if (text.includes(input)) {
            row.style.display = '';
            count++;
        } else {
            row.style.display = 'none';
        }
    });

    document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
}
</script>
</body>
</html>
