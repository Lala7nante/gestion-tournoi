<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: nav}"></nav>
    <div class="container">
        <h1>Ajouter Equipe</h1>
        <!-- ✅ Message erreur -->
        <div th:if="${errorMessage}" class="badge badge-red"
            style="padding:1rem;margin-bottom:1rem;display:block;font-size:1rem">
        ⚠️ <span th:text="${errorMessage}"></span>
        </div>
        <div class="card">
            <form action="/equipes" method="post" th:object="${equipe}">
                <div class="form-group">
                    <label>Groupe</label>
                    <select name="groupeId" required>
                        <option value="">-Choix de groupe-</option>
                        <option th:each="g : ${groupes}"
                                th:value="${g.id}"
                                th:text="'Groupe ' + ${g.nom} + ' — ' + ${g.tournoi.nom}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nom de l'Equipe</label>
                    <input type="text" th:field="*{nom}" required/>
                </div>
                <div class="form-group">
                    <label>Ville</label>
                    <input type="text" th:field="*{ville}"/>
                </div>
                <div class="form-group">
                    <label>Coach</label>
                    <input type="text" th:field="*{coach}"/>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <a href="/equipes" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
