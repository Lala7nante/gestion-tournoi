<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Equipe Form</title></head>
<body>
<div class="container">
    <h1 th:text="${equipe.id == null} ? '+ Nouvelle Equipe' : 'Modifier Equipe'"></h1>
    <div class="card">
        <form th:action="${equipe.id == null} ? '/groupes/' + ${groupe.id} + '/equipes' : '/groupes/' + ${groupe.id} + '/equipes/' + ${equipe.id}"
              th:object="${equipe}" method="post">
            <div class="form-group">
                <label>Nom de l'Equipe</label>
                <input type="text" th:field="*{nom}" required/>
            </div>
            <div class="form-group">
                <label>Ville</label>
                <input type="text" th:field="*{ville}"/>
            </div>
            <div class="form-group">
                <label>Coach</label>
                <input type="text" th:field="*{coach}"/>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/groupes/{id}/equipes(id=${groupe.id})}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
