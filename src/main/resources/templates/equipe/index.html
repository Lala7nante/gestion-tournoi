<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Equipes</title></head>
<body>
<div class="container">
    <div class="header-row">
        <h1>🏟️ Equipes — Groupe <span th:text="${groupe.nom}"></span></h1>
        <div class="actions">
            <a th:href="@{/groupes/{id}/equipes/new(id=${groupe.id})}" class="btn btn-primary">+ Ajouter Equipe</a>
            <a th:href="@{/tournois/{id}/groupes(id=${groupe.tournoi.id})}" class="btn btn-secondary">← Retour</a>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Ville</th>
                <th>Coach</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e, i : ${equipes}">
                <td th:text="${i.count}"></td>
                <td th:text="${e.nom}"></td>
                <td th:text="${e.ville}"></td>
                <td th:text="${e.coach}"></td>
                <td>
                    <div class="actions">
                        <a th:href="@{/equipes/{id}/joueurs(id=${e.id})}" class="btn btn-primary">Joueurs</a>
                        <a th:href="@{/groupes/{gId}/equipes/{id}/edit(gId=${groupe.id},id=${e.id})}" class="btn btn-warning">Modifier</a>
                        <a th:href="@{/groupes/{gId}/equipes/{id}/delete(gId=${groupe.id},id=${e.id})}"
                           class="btn btn-danger" onclick="return confirm('Hamafa ve?')">Supprimer</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
