<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Groupes</title></head>
<body>
<div class="container">
    <div class="header-row">
        <h1>🗂️ Groupes — <span th:text="${tournoi.nom}"></span></h1>
        <div class="actions">
            <form th:action="@{/tournois/{id}/groupes(id=${tournoi.id})}" method="post">
                <button type="submit" class="btn btn-primary">+ Ajouter Groupe</button>
            </form>
            <a th:href="@{/tournois}" class="btn btn-secondary">← Retour</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(groupes)}" class="empty-state">
        Tsy misy groupe mbola.
    </div>

    <div th:each="g : ${groupes}" class="card" style="margin-bottom:1rem">
        <div class="header-row">
            <h2>Groupe <span th:text="${g.nom}"></span></h2>
            <div class="actions">
                <a th:href="@{/groupes/{id}/equipes(id=${g.id})}" class="btn btn-primary">Equipes</a>
                <a th:href="@{/groupes/{id}/classement(id=${g.id})}" class="btn btn-warning">Classement</a>
                <a th:href="@{/tournois/{tId}/groupes/{id}/delete(tId=${tournoi.id},id=${g.id})}"
                   class="btn btn-danger" onclick="return confirm('Hamafa ve?')">Supprimer</a>
            </div>
        </div>
        <p style="color:#666;font-size:0.9rem">
            Equipes: <span th:text="${#lists.size(g.equipes)}">0</span>/4
        </p>
    </div>
</div>
</body>
</html>
