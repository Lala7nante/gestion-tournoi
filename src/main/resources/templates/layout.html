<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Tournoi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap');

        :root {
           --cyan: #00c8ff;
           --blue: #000000;
           --blue-mid: #000000;
           --blue-card: #0d0d0d;
           --blue-border: #111111;
           --text: #e8f4ff;
           --muted: #f7f7f7dc;
          }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--blue);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
        }

        nav {
            background: var(--blue-mid);
            border-bottom: 2px solid var(--cyan);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            height: 60px;
            box-shadow: 0 2px 20px rgba(0,200,255,0.15);
        }

        nav a.nav-link {
            color: var(--muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            transition: all 0.2s;
        }

        nav a.nav-link:hover {
            color: var(--cyan);
            background: rgba(0,200,255,0.08);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--blue-card);
            border: 1px solid var(--blue-border);
            border-top: 3px solid var(--cyan);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card .number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            color: var(--cyan);
            line-height: 1;
         }

        .stat-card .label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.3rem;
        }
        /* CARD */
.card {
    background: var(--blue-card);
    border: 1px solid var(--blue-border);
    border-radius: 8px;
    padding: 2rem;
    margin-bottom: 1.5rem;
}

/* FORM */
.form-group { margin-bottom: 1.2rem; }

label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 0.4rem;
    font-weight: 700;
}

input, select, textarea {
    width: 100%;
    background: var(--blue-mid);
    border: 1px solid var(--blue-border);
    border-radius: 4px;
    padding: 0.7rem 1rem;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    transition: border-color 0.2s;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 0 2px rgba(0,200,255,0.1);
}

/* BUTTONS */
.btn {
    display: inline-block;
    padding: 0.5rem 1.2rem;
    border-radius: 4px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
}

.btn-primary { background: var(--cyan); color: var(--blue); }
.btn-primary:hover { background: #00a8d8; }

.btn-warning { background: #1a5fa8; color: var(--text); border: 1px solid #2a7fd8; }
.btn-warning:hover { background: #2a7fd8; }

.btn-danger { background: #8b1a2e; color: var(--text); border: 1px solid #c0253f; }
.btn-danger:hover { background: #c0253f; }

.btn-secondary { background: var(--blue-border); color: var(--text); }
.btn-secondary:hover { background: #254080; }

/* HEADER ROW */
.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
}

.actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

/* BADGES */
.badge {
    display: inline-block;
    padding: 0.2rem 0.7rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.badge-cyan { background: rgba(0,200,255,0.15); color: var(--cyan); }
.badge-blue { background: rgba(26,95,168,0.3); color: #5ab4ff; }
.badge-red  { background: rgba(192,37,63,0.2); color: #ff6b8a; }

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    background: var(--blue-card);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--blue-border);
}

th {
    background: var(--blue-mid);
    padding: 1rem;
    text-align: left;
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cyan);
    border-bottom: 1px solid var(--blue-border);
}

td {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--blue-border);
    font-weight: 600;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(0,200,255,0.04); }

/* TYPOGRAPHY */
h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    letter-spacing: 3px;
    color: var(--cyan);
    margin-bottom: 1.5rem;
}

h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 2px;
    margin-bottom: 1rem;
    color: var(--text);
}

/* STATS DASHBOARD */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: var(--blue-card);
    border: 1px solid var(--blue-border);
    border-top: 3px solid var(--cyan);
    border-radius: 8px;
    padding: 1.5rem;
    text-align: center;
}

.stat-card .number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    color: var(--cyan);
    line-height: 1;
}

.stat-card .label {
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 0.3rem;
}

.empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 1.1rem;
    letter-spacing: 1px;
}

small { color: var(--muted); font-size: 0.85rem; }

/* CLASSEMENT */
.rank-1 { color: #ffd700; font-size: 1.2rem; }
.rank-2 { color: #c0c0c0; font-size: 1.1rem; }
.rank-3 { color: #cd7f32; font-size: 1rem; }
.diff-pos { color: var(--cyan); }
.diff-neg { color: #ff6b8a; }
    </style>
</head>
<body>
<nav th:fragment="nav">
    <span style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--cyan);margin-right:auto;letter-spacing:2px;">
        GESTION TOURNOI
    </span>
    <a href="/dashboard"    class="nav-link">Dashboard</a>
    <a href="/tournois"     class="nav-link">Tournois</a>
    <a href="/equipes"      class="nav-link">Equipes</a>
    <a href="/matchs"       class="nav-link">Matchs</a>
    <a href="/classement"   class="nav-link">Classement</a>
    <a href="/statistiques" class="nav-link">Statistiques</a>
</nav>
</body>
</html>
