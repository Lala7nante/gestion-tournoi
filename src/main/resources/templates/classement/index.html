<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">

    <h1>🏆 Classement</h1>

    <div th:each="t : ${tournois}" style="margin-bottom:2rem">
        <div class="card">
            <h2 th:text="${t.nom}"></h2>

            <!-- Boutons horizontaux -->
            <div style="display:flex;flex-wrap:wrap;gap:0.5rem;margin:1rem 0">
                <button class="btn btn-secondary"
                        onclick="showAll()">
                    Tous les groupes
                </button>
                <button th:each="g : ${t.groupes}"
                        class="btn btn-primary"
                        th:attr="onclick='showGroup(' + ${g.id} + ')'"
                        th:text="'Groupe ' + ${g.nom}">
                </button>
            </div>

            <!-- Classements par groupe -->
            <div th:each="g : ${t.groupes}"
                 th:id="'groupe-' + ${g.id}"
                 class="groupe-section"
                 style="margin-top:1.5rem">
                <h3 style="color:#00d4ff;margin-bottom:0.5rem">
                    Groupe <span th:text="${g.nom}"></span>
                </h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Equipe</th>
                            <th>J</th>
                            <th>V</th>
                            <th>N</th>
                            <th>D</th>
                            <th>BP</th>
                            <th>BC</th>
                            <th>DB</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c, i : ${classementMap[g.id]}">
                            <td th:text="${i.count}"></td>
                            <td th:text="${c.equipe.nom}"></td>
                            <td th:text="${c.victoires + c.nuls + c.defaites}"></td>
                            <td th:text="${c.victoires}"></td>
                            <td th:text="${c.nuls}"></td>
                            <td th:text="${c.defaites}"></td>
                            <td th:text="${c.butsMarques}"></td>
                            <td th:text="${c.butsEncaisses}"></td>
                            <td th:text="${c.differenceButs}"></td>
                            <td><strong th:text="${c.points}"></strong></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
function showAll() {
    document.querySelectorAll('.groupe-section').forEach(el => el.style.display = 'block');
}

function showGroup(id) {
    document.querySelectorAll('.groupe-section').forEach(el => el.style.display = 'none');
    document.getElementById('groupe-' + id).style.display = 'block';
}
</script>

</body>
</html>
