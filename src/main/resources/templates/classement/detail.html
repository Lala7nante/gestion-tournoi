<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">

    <div class="header-row">
        <h1>🏆 Classement — Groupe <span th:text="${groupe.nom}"></span></h1>
        <a th:href="@{/classement}" class="btn btn-secondary">← Retour</a>
    </div>

    <div th:if="${#lists.isEmpty(classements)}" class="empty-state">
        Aucun classement disponible.
    </div>

    <table th:if="${!#lists.isEmpty(classements)}">
        <thead>
            <tr>
                <th>#</th>
                <th>Equipe</th>
                <th>J</th>
                <th>V</th>
                <th>N</th>
                <th>D</th>
                <th>BP</th>
                <th>BC</th>
                <th>DB</th>
                <th>Pts</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c, i : ${classements}">
                <td th:text="${i.count}"></td>
                <td th:text="${c.equipe.nom}"></td>
                <td th:text="${c.victoires + c.nuls + c.defaites}"></td>
                <td th:text="${c.victoires}"></td>
                <td th:text="${c.nuls}"></td>
                <td th:text="${c.defaites}"></td>
                <td th:text="${c.butsMarques}"></td>
                <td th:text="${c.butsEncaisses}"></td>
                <td th:text="${c.differenceButs}"></td>
                <td><strong th:text="${c.points}"></strong></td>
            </tr>
        </tbody>
    </table>

</div>
</body>
</html>
