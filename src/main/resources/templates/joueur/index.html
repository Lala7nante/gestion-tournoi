<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Joueurs</title></head>
<body>
<div class="container">
    <div class="header-row">
        <h1>👟 Joueurs — <span th:text="${equipe.nom}"></span></h1>
        <div class="actions">
            <a th:href="@{/equipes/{id}/joueurs/new(id=${equipe.id})}" class="btn btn-primary">+ Ajouter Joueur</a>
            <a th:href="@{/groupes/{id}/equipes(id=${equipe.groupe.id})}" class="btn btn-secondary">← Retour</a>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Age</th>
                <th>Poste</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="j, i : ${joueurs}">
                <td th:text="${i.count}"></td>
                <td th:text="${j.nom}"></td>
                <td th:text="${j.prenom}"></td>
                <td th:text="${j.age}"></td>
                <td>
                    <span class="badge badge-green" th:text="${j.poste}"></span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{/statistiques/joueur/{id}(id=${j.id})}" class="btn btn-secondary">Stats</a>
                        <a th:href="@{/equipes/{eId}/joueurs/{id}/edit(eId=${equipe.id},id=${j.id})}" class="btn btn-warning">Modifier</a>
                        <a th:href="@{/equipes/{eId}/joueurs/{id}/delete(eId=${equipe.id},id=${j.id})}"
                           class="btn btn-danger" onclick="return confirm('Hamafa ve?')">Supprimer</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
