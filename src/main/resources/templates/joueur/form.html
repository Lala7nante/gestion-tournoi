<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Joueur Form</title></head>
<body>
<div class="container">
    <h1 th:text="${joueur.id == null} ? '+ Nouveau Joueur' : 'Modifier Joueur'"></h1>
    <div class="card">
        <form th:action="${joueur.id == null} ? '/equipes/' + ${equipe.id} + '/joueurs' : '/equipes/' + ${equipe.id} + '/joueurs/' + ${joueur.id}"
              th:object="${joueur}" method="post">
            <div class="form-group">
                <label>Nom</label>
                <input type="text" th:field="*{nom}" required/>
            </div>
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" th:field="*{prenom}" required/>
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" th:field="*{age}" min="15" max="50" required/>
            </div>
            <div class="form-group">
                <label>Poste</label>
                <select th:field="*{poste}">
                    <option th:each="p : ${postes}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/equipes/{id}/joueurs(id=${equipe.id})}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
