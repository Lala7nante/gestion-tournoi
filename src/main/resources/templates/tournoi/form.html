<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: nav}"></nav>
    <div class="container">
        <h1 th:text="${tournoi.id == null} ? 'Nouveau Tournoi' : 'Modifier Tournoi'"></h1>
        <div class="card">
            <form th:action="${tournoi.id == null} ? '/tournois' : '/tournois/' + ${tournoi.id}"
                  th:object="${tournoi}" method="post">

                <div class="form-group">
                    <label>Nom du Tournoi</label>
                    <input type="text" th:field="*{nom}" required/>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Date Début</label>
                    <input type="date" th:field="*{dateDebut}" required/>
                </div>
                <div class="form-group">
                    <label>Date Fin</label>
                    <input type="date" th:field="*{dateFin}" required/>
                </div>
                <div class="form-group">
                    <label>Nombre de Groupes</label>
                    <input type="number" th:field="*{nbGroupes}" min="3" max="8" required/>
                    <small>Nb Equipes = Groupes × 4</small>
                </div>
                <div class="form-group" th:if="${tournoi.id != null}">
                    <label>Statut</label>
                    <select th:field="*{statut}">
                        <option value="EN_COURS">EN COURS</option>
                        <option value="TERMINE">TERMINÉ</option>
                    </select>
                </div>
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                    <a href="/tournois" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
