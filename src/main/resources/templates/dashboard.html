<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1>Dashboard</h1>

    <div class="dashboard-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">

        <!-- Champions — EN PREMIER, pleine largeur -->
        <div class="card full-width" style="grid-column:1/3">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1.5rem">
                🏆 PALMARÈS
            </h2>
            <div th:if="${champions == null or #lists.isEmpty(champions)}"
                 style="color:#666;text-align:center;padding:1rem">
                Tournoi pas encore terminé
            </div>
            <div th:unless="${champions == null or #lists.isEmpty(champions)}"
                 style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem">
                <div th:each="c : ${champions}"
                     style="display:flex;align-items:center;gap:1.5rem;
                            padding:1.2rem;border-radius:8px;background:#111;
                            border:1px solid #222">
                    <div style="font-size:2.5rem;min-width:50px;text-align:center"
                         th:text="${c[0] == '🏆 Champion'} ? '🥇' :
                                   (${c[0] == '🥈 Finaliste'} ? '🥈' : '🥉')">
                    </div>
                    <div>
                        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:#00c8ff"
                             th:text="${c[1]}"></div>
                        <div style="font-size:0.8rem;letter-spacing:1px;margin-top:0.2rem"
                             th:style="${c[0] == '🏆 Champion'} ? 'color:#ffd700' :
                                        (${c[0] == '🥈 Finaliste'} ? 'color:#c0c0c0' : 'color:#cd7f32')"
                             th:text="${c[0]}">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Derniers résultats -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">
                🏁 DERNIERS RÉSULTATS
            </h2>
            <div th:if="${#lists.isEmpty(derniersResultats)}"
                 style="color:#666;text-align:center;padding:1rem">
                Aucun match terminé
            </div>
            <div th:each="m : ${derniersResultats}"
                 style="display:flex;justify-content:space-between;align-items:center;
                        padding:0.6rem 0;border-bottom:1px solid #222">
                <span style="flex:1;text-align:right;font-size:0.9rem"
                      th:text="${m.equipeDomicile.nom}"></span>
                <span style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;
                             color:#00c8ff;margin:0 1rem;min-width:60px;text-align:center"
                      th:text="${m.scoreDomicile} + ' - ' + ${m.scoreExterieur}"></span>
                <span style="flex:1;text-align:left;font-size:0.9rem"
                      th:text="${m.equipeExterieur.nom}"></span>
            </div>
        </div>

        <!-- Prochains matchs -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">
                📅 PROCHAINS MATCHS
            </h2>
            <div th:if="${#lists.isEmpty(prochainsMatchs)}"
                 style="color:#666;text-align:center;padding:1rem">
                Aucun match prévu
            </div>
            <div th:each="m : ${prochainsMatchs}"
                 style="display:flex;justify-content:space-between;align-items:center;
                        padding:0.6rem 0;border-bottom:1px solid #222">
                <span style="flex:1;text-align:right;font-size:0.9rem"
                      th:text="${m.equipeDomicile.nom}"></span>
                <span style="color:#666;margin:0 1rem;font-size:0.8rem;min-width:80px;text-align:center"
                      th:text="${m.dateMatch}"></span>
                <span style="flex:1;text-align:left;font-size:0.9rem"
                      th:text="${m.equipeExterieur.nom}"></span>
            </div>
        </div>

        <!-- Top Buteur -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">
                ⚽ MEILLEUR BUTEUR
            </h2>
            <div th:if="${topButeur == null}"
                 style="color:#666;text-align:center;padding:1rem">
                Aucune statistique disponible
            </div>
            <div th:unless="${topButeur == null}"
                 style="text-align:center;padding:1rem">
                <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#00c8ff"
                     th:text="${topButeur[0].prenom} + ' ' + ${topButeur[0].nom}"></div>
                <div style="color:#aaa;font-size:0.9rem;margin-top:0.3rem"
                     th:text="${topButeur[0].equipe.nom}"></div>
                <div style="font-family:'Bebas Neue',sans-serif;font-size:3rem;color:#fff;margin-top:0.5rem"
                     th:text="${topButeur[1]} + ' buts'"></div>
            </div>
        </div>

        <!-- Homme du Tournoi -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">
                🏆 HOMME DU TOURNOI
            </h2>
            <div th:if="${hommeTournoi == null}"
                 style="color:#666;text-align:center;padding:1rem">
                Aucune statistique disponible
            </div>
            <div th:unless="${hommeTournoi == null}"
                 style="text-align:center;padding:1rem">
                <div style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#00c8ff"
                     th:text="${hommeTournoi[0].prenom} + ' ' + ${hommeTournoi[0].nom}"></div>
                <div style="color:#aaa;font-size:0.9rem;margin-top:0.3rem"
                     th:text="${hommeTournoi[0].equipe.nom}"></div>
                <div style="color:#666;font-size:0.85rem;margin-top:0.5rem"
                     th:text="'Buts + Passes : ' + ${hommeTournoi[1]}"></div>
            </div>
        </div>

    </div>

    <!-- Stats générales -->
    <div class="stats-grid" style="margin-top:1.5rem">
        <div class="stat-card">
            <div class="number" th:text="${nbTournois}">0</div>
            <div class="label">Tournois</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${nbGroupes}">0</div>
            <div class="label">Groupes</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${nbEquipes}">0</div>
            <div class="label">Equipes</div>
        </div>
        <div class="stat-card">
            <div class="number" th:text="${nbMatchs}">0</div>
            <div class="label">Matchs</div>
        </div>
    </div>

</div>
</body>
</html>
