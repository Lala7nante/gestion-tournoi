<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/css/select2.min.css"/>
<style>
    .select2-container--default .select2-selection--single {
        background-color: #080808;
        border: 1px solid #222;
        border-radius: 6px;
        height: 42px;
        display: flex;
        align-items: center;
        padding: 0 0.5rem;
    }
    .select2-container--default .select2-selection--single .select2-selection__rendered {
        color: #e8f4ff;
        line-height: 42px;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
    }
    .select2-container--default .select2-selection--single .select2-selection__arrow {
        height: 42px;
    }
    .select2-dropdown {
        background-color: #0d0d0d;
        border: 1px solid #222;
        border-radius: 6px;
    }
    .select2-container--default .select2-results__option {
        color: #e8f4ff;
        padding: 0.5rem 1rem;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 600;
    }
    .select2-container--default .select2-results__option--highlighted[aria-selected] {
        background-color: #00c8ff;
        color: #000;
    }
    .select2-container--default .select2-search--dropdown .select2-search__field {
        background-color: #111;
        border: 1px solid #333;
        color: #e8f4ff;
        padding: 0.5rem;
        border-radius: 4px;
        font-family: 'Rajdhani', sans-serif;
    }
    .select2-container { width: 100% !important; }
</style>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1>Nouveau Match</h1>
    <div class="card">
        <form action="/matchs" method="post">

            <!-- Equipe Domicile -->
            <div class="form-group">
                <label>Equipe Domicile</label>
                <select name="domId" id="domSelect" required>
                    <option value="">-- Rechercher équipe domicile --</option>
                    <option th:each="e : ${equipes}"
                            th:value="${e.id}"
                            th:text="${e.nom} + ' (Groupe ' + ${e.groupe.nom} + ')'">
                    </option>
                </select>
            </div>

            <!-- Equipe Extérieur -->
            <div class="form-group">
                <label>Equipe Extérieur</label>
                <select name="extId" id="extSelect" required>
                    <option value="">-- Rechercher équipe extérieur --</option>
                    <option th:each="e : ${equipes}"
                            th:value="${e.id}"
                            th:text="${e.nom} + ' (Groupe ' + ${e.groupe.nom} + ')'">
                    </option>
                </select>
            </div>

            <!-- Date -->
            <div class="form-group">
                <label>Date du Match</label>
                <input type="date" name="dateMatch" required/>
            </div>

            <!-- Lieu -->
            <div class="form-group">
                <label>Lieu</label>
                <input type="text" name="lieu" placeholder="Ex: Stade de France"/>
            </div>

            <!-- Phase -->
            <div class="form-group">
                <label>Phase</label>
                <select name="phase" required>
                    <option th:each="p : ${phases}"
                            th:value="${p}"
                            th:text="${p}">
                    </option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="/matchs" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/js/select2.min.js"></script>
<script>
$(document).ready(function() {
    $('#domSelect').select2({
        placeholder: "🔍 Rechercher équipe domicile...",
        allowClear: true,
        language: {
            noResults: function() { return "Aucune équipe trouvée"; },
            searching: function() { return "Recherche..."; }
        }
    });
    $('#extSelect').select2({
        placeholder: "🔍 Rechercher équipe extérieur...",
        allowClear: true,
        language: {
            noResults: function() { return "Aucune équipe trouvée"; },
            searching: function() { return "Recherche..."; }
        }
    });
});
</script>
</body>
</html>
