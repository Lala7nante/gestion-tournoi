<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <div class="header-row">
        <h1>⚽ Matchs</h1>
        <a href="/matchs/new" class="btn btn-primary">+ Nouveau Match</a>
        <a href="/matchs/tirage" class="btn btn-primary">Tirage</a>
    </div>
     
    <div th:if="${errorMessage}" class="badge badge-red"
         style="padding:1rem;margin-bottom:1rem;display:block;font-size:1rem">
        ⚠️ <span th:text="${errorMessage}"></span>
    </div>

    <!-- FILTRES -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:1rem;margin-bottom:1.5rem">

        <!-- Par date -->
        <div>
            <label style="color:#666;font-size:0.8rem;letter-spacing:1px;display:block;margin-bottom:0.4rem">
                📅 DATE
            </label>
            <input type="date" id="filtreDate"
                   onchange="filtrerMatchs()"
                   style="width:100%;padding:0.7rem;background:#111;border:1px solid #333;
                          color:#fff;border-radius:8px;font-size:0.9rem;box-sizing:border-box"/>
        </div>

        <!-- Par phase -->
        <div>
            <label style="color:#666;font-size:0.8rem;letter-spacing:1px;display:block;margin-bottom:0.4rem">
                🏆 PHASE
            </label>
            <select id="filtrePhase" onchange="filtrerMatchs()"
                    style="width:100%;padding:0.7rem;background:#111;border:1px solid #333;
                           color:#fff;border-radius:8px;font-size:0.9rem;box-sizing:border-box">
                <option value="">Toutes les phases</option>
                <option value="GROUPE">Groupe</option>
                <option value="ROUND_16">Round of 16</option>
                <option value="QUART">Quart de finale</option>
                <option value="DEMI">Demi-finale</option>
                <option value="TROISIEME">3ème Place</option>
                <option value="FINALE">Finale</option>
            </select>
        </div>

        <!-- Par équipe -->
        <div>
            <label style="color:#666;font-size:0.8rem;letter-spacing:1px;display:block;margin-bottom:0.4rem">
                🔍 ÉQUIPE
            </label>
            <input type="text" id="filtreEquipe"
                   placeholder="Nom d'équipe..."
                   oninput="filtrerMatchs()"
                   style="width:100%;padding:0.7rem;background:#111;border:1px solid #333;
                          color:#fff;border-radius:8px;font-size:0.9rem;box-sizing:border-box"/>
        </div>

        <!-- Reset -->
        <div style="display:flex;align-items:flex-end">
            <button onclick="resetFiltres()" class="btn btn-secondary">
                ✕ Reset
            </button>
        </div>

    </div>

    <div th:if="${#lists.isEmpty(matchs)}" class="empty-state">
        Aucun match pour le moment.
    </div>

    <table th:unless="${#lists.isEmpty(matchs)}" id="matchTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Domicile</th>
                <th>Score</th>
                <th>Extérieur</th>
                <th>Date</th>
                <th>Phase</th>
                <th>Statut</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="matchBody">
            <tr th:each="m, i : ${matchs}"
                th:attr="data-date=${m.dateMatch},
                         data-phase=${m.phase},
                         data-equipes=${m.equipeDomicile.nom + ' ' + m.equipeExterieur.nom}">
                <td th:text="${i.count}"></td>
                <td th:text="${m.equipeDomicile.nom}"></td>
                <td>
                    <span th:if="${m.statut.name() == 'TERMINE'}"
                          th:text="${m.scoreDomicile} + ' - ' + ${m.scoreExterieur}"
                          style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:#00c8ff">
                    </span>
                    <span th:unless="${m.statut.name() == 'TERMINE'}"
                          style="color:#5a7aa8">vs</span>
                </td>
                <td th:text="${m.equipeExterieur.nom}"></td>
                <td th:text="${m.dateMatch}"></td>
                <td>
                    <span class="badge badge-blue" th:text="${m.phase}"></span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${m.statut.name() == 'TERMINE'} ? 'badge-cyan' : 'badge-blue'"
                          th:text="${m.statut}">
                    </span>
                </td>
                <td>
                    <div class="actions" style="display:flex;flex-wrap:nowrap;gap:0.5rem">
                        <a th:if="${m.statut.name() == 'PREVU'}"
                           th:href="@{/matchs/{id}/score(id=${m.id})}"
                           class="btn btn-primary">Score</a>
                        <a th:if="${m.statut.name() == 'TERMINE'}"
                           th:href="@{/statistiques/match/{id}(id=${m.id})}"
                           class="btn btn-secondary">Stats</a>
                        <a th:href="@{/matchs/{id}/delete(id=${m.id})}"
                           class="btn btn-danger"
                           onclick="return confirm('Voulez-vous supprimer ce match ?')">Supprimer</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Aucun résultat -->
    <div id="noResult" style="display:none;text-align:center;color:#666;padding:2rem">
        Aucun match trouvé pour ces critères
    </div>

</div>

<script>
function filtrerMatchs() {
    const date = document.getElementById('filtreDate').value;
    const phase = document.getElementById('filtrePhase').value.toLowerCase();
    const equipe = document.getElementById('filtreEquipe').value.toLowerCase();
    const rows = document.querySelectorAll('#matchBody tr');
    let count = 0;

    rows.forEach(row => {
        const rowDate = row.getAttribute('data-date') || '';
        const rowPhase = row.getAttribute('data-phase').toLowerCase() || '';
        const rowEquipes = row.getAttribute('data-equipes').toLowerCase() || '';

        const matchDate = date === '' || rowDate === date;
        const matchPhase = phase === '' || rowPhase === phase;
        const matchEquipe = equipe === '' || rowEquipes.includes(equipe);

        if (matchDate && matchPhase && matchEquipe) {
            row.style.display = '';
            count++;
        } else {
            row.style.display = 'none';
        }
    });

    document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
}

function resetFiltres() {
    document.getElementById('filtreDate').value = '';
    document.getElementById('filtrePhase').value = '';
    document.getElementById('filtreEquipe').value = '';
    filtrerMatchs();
}
</script>
</body>
</html>
