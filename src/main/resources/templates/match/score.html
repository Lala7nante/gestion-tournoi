<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1>⚽ Enregistrer Score</h1>
    <div class="card">
        <h2 style="text-align:center;margin-bottom:2rem">
            <span th:text="${match.equipeDomicile.nom}"></span>
            <span style="color:#666;margin:0 1rem">vs</span>
            <span th:text="${match.equipeExterieur.nom}"></span>
        </h2>

        <form th:action="@{/matchs/{id}/score(id=${match.id})}" method="post">

            <!-- SCORE 90 MIN -->
            <h2 style="color:#666;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">SCORE 90 MIN</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem">
                <div class="form-group">
                    <label th:text="${match.equipeDomicile.nom}"></label>
                    <input type="number" name="scoreDom" min="0" value="0" required/>
                </div>
                <div class="form-group">
                    <label th:text="${match.equipeExterieur.nom}"></label>
                    <input type="number" name="scoreExt" min="0" value="0" required/>
                </div>
            </div>

            <!-- STATS PAR EQUIPE -->
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1.5rem;margin-top:1.5rem">
                STATISTIQUES DU MATCH
            </h2>

            <div style="display:grid;grid-template-columns:1fr 200px 1fr;gap:0.8rem;align-items:center">

                <input type="number" name="tirsDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Tirs</div>
                <input type="number" name="tirsExterieur" min="0" value="0" style="text-align:center"/>

                <input type="number" name="tirsCadresDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Tirs Cadrés</div>
                <input type="number" name="tirsCadresExterieur" min="0" value="0" style="text-align:center"/>

                <input type="number" name="possessionDomicile" min="0" max="100" value="50" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Possession (%)</div>
                <input type="number" name="possessionExterieur" min="0" max="100" value="50" style="text-align:center"/>

                <input type="number" name="passesDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Passes</div>
                <input type="number" name="passesExterieur" min="0" value="0" style="text-align:center"/>

                <input type="number" name="fautesDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Fautes</div>
                <input type="number" name="fautesExterieur" min="0" value="0" style="text-align:center"/>

                <input type="number" name="cartonsJaunesDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Cartons Jaunes</div>
                <input type="number" name="cartonsJaunesExterieur" min="0" value="0" style="text-align:center"/>

                <input type="number" name="cartonsRougesDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Cartons Rouges</div>
                <input type="number" name="cartonsRougesExterieur" min="0" value="0" style="text-align:center"/>

                <input type="number" name="cornersDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Corners</div>
                <input type="number" name="cornersExterieur" min="0" value="0" style="text-align:center"/>

                <input type="number" name="horsJeuDomicile" min="0" value="0" style="text-align:center"/>
                <div style="text-align:center;color:#00c8ff;font-size:0.85rem">Hors-Jeu</div>
                <input type="number" name="horsJeuExterieur" min="0" value="0" style="text-align:center"/>

            </div>

            <!-- PROLONGATION -->
            <div th:if="${match.phase.name() != 'GROUPE'}" style="margin:1.5rem 0">
                <div class="form-group">
                    <label style="color:#ff9f1c">
                        <input type="checkbox" name="prolongation" value="true" id="chkProl"
                               onchange="document.getElementById('prolSection').style.display=this.checked?'block':'none'"/>
                        Prolongation?
                    </label>
                </div>
                <div id="prolSection" style="display:none">
                    <h2 style="color:#ff9f1c;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">SCORE PROLONGATION</h2>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
                        <div class="form-group">
                            <label th:text="${match.equipeDomicile.nom}"></label>
                            <input type="number" name="scoreProlDom" min="0" value="0"/>
                        </div>
                        <div class="form-group">
                            <label th:text="${match.equipeExterieur.nom}"></label>
                            <input type="number" name="scoreProlExt" min="0" value="0"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="color:#ff3b3b">
                            <input type="checkbox" name="penalty" value="true" id="chkPen"
                                   onchange="document.getElementById('penSection').style.display=this.checked?'block':'none'"/>
                            Penalty?
                        </label>
                    </div>
                    <div id="penSection" style="display:none">
                        <h2 style="color:#ff3b3b;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">SCORE PENALTY</h2>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
                            <div class="form-group">
                                <label th:text="${match.equipeDomicile.nom}"></label>
                                <input type="number" name="scorePenDom" min="0" value="0"/>
                            </div>
                            <div class="form-group">
                                <label th:text="${match.equipeExterieur.nom}"></label>
                                <input type="number" name="scorePenExt" min="0" value="0"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="actions" style="margin-top:1.5rem">
                <button type="submit" class="btn btn-primary">Confirmer</button>
                <a th:href="@{/matchs}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
