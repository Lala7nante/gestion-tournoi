<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">

    <div class="header-row">
        <h1>📊 Statistiques — <span th:text="${tournoi.nom}"></span></h1>
        <a href="/statistiques" class="btn btn-secondary">← Retour</a>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">

        <!-- Top Buteurs -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">⚽ MEILLEURS BUTEURS</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Joueur</th>
                        <th>Equipe</th>
                        <th>Buts</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, i : ${topButeurs}">
                        <td th:text="${i.count}"
                            th:class="${i.count == 1} ? 'rank-1' : (${i.count == 2} ? 'rank-2' : (${i.count == 3} ? 'rank-3' : ''))"></td>
                        <td th:text="${row[0].prenom} + ' ' + ${row[0].nom}"></td>
                        <td th:text="${row[0].equipe.nom}"></td>
                        <td style="color:#00c8ff;font-weight:700" th:text="${row[1]}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Top Passeurs -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">👟 MEILLEURS PASSEURS</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Joueur</th>
                        <th>Equipe</th>
                        <th>Passes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, i : ${topPasseurs}">
                        <td th:text="${i.count}"
                            th:class="${i.count == 1} ? 'rank-1' : (${i.count == 2} ? 'rank-2' : (${i.count == 3} ? 'rank-3' : ''))"></td>
                        <td th:text="${row[0].prenom} + ' ' + ${row[0].nom}"></td>
                        <td th:text="${row[0].equipe.nom}"></td>
                        <td style="color:#00c8ff;font-weight:700" th:text="${row[1]}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Top Cartons -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">🟡🔴CARTONS</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Joueur</th>
                        <th>Equipe</th>
                        <th>🟡</th>
                        <th>🔴</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, i : ${topCartons}">
                        <td th:text="${i.count}"></td>
                        <td th:text="${row[0].prenom} + ' ' + ${row[0].nom}"></td>
                        <td th:text="${row[0].equipe.nom}"></td>
                        <td style="color:#ff9f1c;font-weight:700" th:text="${row[1]}"></td>
                        <td style="color:#ff6b8a;font-weight:700" th:text="${row[2]}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Homme du Match -->
        <div class="card">
            <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">🏆 HOMME DU TOURNOI</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Joueur</th>
                        <th>Equipe</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, i : ${hommesDuMatch}">
                        <td th:text="${i.count}"
                            th:class="${i.count == 1} ? 'rank-1' : (${i.count == 2} ? 'rank-2' : (${i.count == 3} ? 'rank-3' : ''))"></td>
                        <td th:text="${row[0].prenom} + ' ' + ${row[0].nom}"></td>
                        <td th:text="${row[0].equipe.nom}"></td>
                        <td style="color:#00c8ff;font-weight:700" th:text="${row[1]}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Meilleur Club -->
<div class="card" style="margin-top:1.5rem">
    <h2 style="color:#00c8ff;font-size:1rem;letter-spacing:2px;margin-bottom:1rem">🏅 MEILLEUR CLUB</h2>
    <div th:if="${#lists.isEmpty(meilleurClub)}"
         style="color:#666;text-align:center;padding:1rem">
        Tournoi pas encore terminé
    </div>
    <table th:unless="${#lists.isEmpty(meilleurClub)}">
        <thead>
            <tr>
                <th>Rang</th>
                <th>Club</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${meilleurClub}">
                <td th:text="${row[0]}"
                    style="font-weight:700"></td>
                <td th:text="${row[1]}"
                    style="color:#00c8ff;font-weight:700"></td>
            </tr>
        </tbody>
    </table>
</div>

</div>
</body>
</html>
