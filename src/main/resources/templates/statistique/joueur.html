<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <div class="header-row">
        <h1>📈 Stats — <span th:text="${joueur.prenom} + ' ' + ${joueur.nom}"></span></h1>
        <a th:href="@{/equipes/{id}/joueurs(id=${joueur.equipe.id})}" class="btn btn-secondary">← Retour</a>
    </div>

    <p style="color:#00c8ff;margin-bottom:1.5rem;font-weight:700;letter-spacing:1px"
       th:text="${joueur.equipe.nom} + ' · ' + ${joueur.poste}"></p>

    <div th:if="${#lists.isEmpty(statistiques)}" class="empty-state">
        Aucune statistique disponible.
    </div>

    <table th:if="${!#lists.isEmpty(statistiques)}">
        <thead>
            <tr>
                <th>Match</th>
                <th>⚽ Buts</th>
                <th>🎯 Passes</th>
                <th>🟡 C.Jaune</th>
                <th>🔴 C.Rouge</th>
                <th>⏱️ Minutes</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${statistiques}">
                <td th:text="${s.match.equipeDomicile.nom} + ' vs ' + ${s.match.equipeExterieur.nom}"></td>
                <td th:text="${s.buts}" style="color:#00ff87;font-weight:700"></td>
                <td th:text="${s.passesDecisives}"></td>
                <td th:text="${s.cartonsJaunes}" style="color:#ff9f1c"></td>
                <td th:text="${s.cartonsRouges}" style="color:#ff3b3b"></td>
                <td th:text="${s.minutesJouees}"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
