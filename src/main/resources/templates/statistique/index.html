<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<div class="container">
    <h1>📊 Statistiques</h1>

    <!-- Choix Tournoi — redirige directement vers stats tournoi -->
    <div th:each="t : ${tournois}" class="card" style="margin-bottom:1rem">
        <div class="header-row">
            <h2 th:text="${t.nom}"></h2>
            <a th:href="@{/statistiques/tournoi/{id}(id=${t.id})}"
               class="btn btn-primary">Voir Statistiques →</a>
        </div>
    </div>

</div>
</body>
</html>
